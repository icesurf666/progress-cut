<div
  id="window-picker"
  class="window-picker hidden"
  role="dialog"
  aria-modal="true"
  aria-label="Select capture source"
>
  <div class="wp-backdrop"></div>
  <div class="wp-inner">
    <div class="wp-header">
      <div>
        <div class="eyebrow">CAPTURE SOURCE</div>
        <h2>Select a window</h2>
      </div>
      <button id="wp-close" class="preview-close" aria-label="Close">✕</button>
    </div>
    <div class="wp-options">
      <button class="wp-source wp-source--active" id="wp-fullscreen" type="button">
        <div class="wp-thumb wp-thumb--screen">
          <span class="wp-screen-icon">⬜</span>
        </div>
        <span class="wp-name">Full screen</span>
      </button>
    </div>
    <div class="wp-grid" id="wp-grid"></div>
  </div>
</div>
